name: Verify MCP

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test

  containers:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build standard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          tags: anycrawl-mcp:verify
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Build combined image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          load: true
          platforms: ${{ matrix.platform }}
          tags: anycrawl-mcp-combined:verify
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Check actual image runtimes and Nginx handshakes
        run: npm run test:containers -- anycrawl-mcp:verify anycrawl-mcp-combined:verify
        env:
          TEST_DOCKER_PLATFORM: ${{ matrix.platform }}
