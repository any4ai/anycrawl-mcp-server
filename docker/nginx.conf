# PID file location
pid /tmp/nginx.pid;

events {}
http {
  upstream app_mcp { server 127.0.0.1:3000; }
  upstream app_sse { server 127.0.0.1:3001; }
  gzip off;

  # Streamable HTTP clients (Codex, Cursor) send Accept: application/json, text/event-stream.
  # Legacy SSE clients only need text/event-stream on GET /sse.
  map $http_accept $accepts_json {
    default 0;
    ~*application/json 1;
  }

  map "$request_method:$accepts_json" $block_streamable_on_sse {
    default 0;
    "GET:1" 1;
  }

  server {
    listen 80;

    location = / {
      default_type application/json;
      return 200 '{"status":"ok","service":"anycrawl-mcp","endpoints":{"streamable_http":"/{API_KEY}/mcp","sse":"/{API_KEY}/sse","health":"/health"},"note":"Codex and Cursor must use /{API_KEY}/mcp (streamable HTTP), not /sse."}';
    }

    # API Key based routes (higher priority)
    # Map /{API_KEY}/sse -> /sse (SSE upstream)
    location ~ ^/(?<apikey>[^/]+)/sse$ {
      default_type application/json;
      if ($block_streamable_on_sse) {
        return 400 '{"error":"Use /YOUR_API_KEY/mcp for streamable HTTP clients (Codex, Cursor). /sse is legacy SSE transport only."}';
      }

      proxy_set_header x-anycrawl-api-key $apikey;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;

      # Rewrite SSE endpoint event so POST /messages includes the API key prefix
      sub_filter 'data: /messages' 'data: /$apikey/messages';
      sub_filter_once off;
      sub_filter_types text/event-stream;

      rewrite ^/.*/sse$ /sse break;
      proxy_pass http://app_sse;
    }

    # Map /{API_KEY}/messages -> /messages (SSE upstream)
    location ~ ^/(?<apikey>[^/]+)/messages$ {
      proxy_set_header x-anycrawl-api-key $apikey;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      # POST acknowledgements have no Content-Length; allow framing without closing TCP.
      chunked_transfer_encoding on;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      rewrite ^/[^/]+/messages$ /messages break;
      proxy_pass http://app_sse;
    }

    # Map /{API_KEY}/mcp -> /mcp (MCP upstream)
    location ~ ^/(?<apikey>[^/]+)/mcp$ {
      proxy_set_header x-anycrawl-api-key $apikey;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;

      rewrite ^/.*/mcp$ /mcp break;
      proxy_pass http://app_mcp;
    }

    # Generic API Key route for other MCP endpoints
    location ~ ^/(?<apikey>[^/]+)/(.*)$ {
      proxy_set_header x-anycrawl-api-key $apikey;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;

      rewrite ^/[^/]+/(.*)$ /$1 break;
      proxy_pass http://app_mcp;
    }

    # Direct header-based paths
    location /mcp {
      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_pass http://app_mcp/mcp;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /messages {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      # POST acknowledgements have no Content-Length; allow framing without closing TCP.
      chunked_transfer_encoding on;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app_sse/messages;
    }

    # SSE upstream
    location /sse {
      default_type application/json;
      if ($block_streamable_on_sse) {
        return 400 '{"error":"Use /YOUR_API_KEY/mcp for streamable HTTP clients (Codex, Cursor). /sse is legacy SSE transport only."}';
      }

      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      chunked_transfer_encoding off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header Accept "text/event-stream";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app_sse/sse;
    }

    location /health {
      proxy_buffering off;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app_mcp/health;
    }

    # Dedicated health check for MCP upstream
    location /health_mcp {
      proxy_buffering off;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app_mcp/health;
    }

    # Dedicated health check for SSE upstream
    location /health_sse {
      proxy_buffering off;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app_sse/health;
    }
  }
}
